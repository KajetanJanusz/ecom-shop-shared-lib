[project]
name = "ecom-shop-shared-lib"
version = "0.1.0"
description = ""
authors = [
    {name = "kajetanjanusz",email = "kajtek.k.janusz@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "immutabledict (>=4.3.1,<5.0.0)",
    "starlette (>=0.52.1,<0.53.0)",
    "testcontainers (>=4.14.2,<5.0.0)",
    "sqlalchemy[asyncio] (>=2.0.0,<3.0.0)",
    "asyncpg (>=0.29.0,<1.0.0)",
    "confluent-kafka (>=2.0.0,<3.0.0)",
    "aio-pika (>=9.0.0,<10.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.24.0,<1.0.0)",
    "PyJWT (>=2.0.0,<3.0.0)",
    "pika (>=1.3.2,<2.0.0)",
    "greenlet (>=3.3.2,<4.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "mockafka-py (>=0.2.3,<0.3.0)",
    "orjson (>=3.11.7,<4.0.0)",
    "fastapi (>=0.135.1,<0.136.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = [".", "shared", "shared/brokers", "shared/exceptions", "tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
